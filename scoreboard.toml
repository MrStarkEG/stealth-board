# Everything the scoreboard tests is listed in this one file.

tries = 3      # fetches per tool, mode and target in one run
timeout = 90   # seconds before one fetch is killed

# Tools. Each one has a script adapters/NAME_adapter.py.
# modes: "http" for HTTP clients. Browsers use "headless" and "headed".
# control = true marks the plain tools that should fail on protected targets.

[[tool]]
name = "requests"
modes = ["http"]
control = true

[[tool]]
name = "playwright"
modes = ["headless", "headed"]
control = true

[[tool]]
name = "curl_cffi"
modes = ["http"]

[[tool]]
name = "patchright"
modes = ["headless", "headed"]

[[tool]]
name = "camoufox"
modes = ["headless", "headed"]

[[tool]]
name = "nodriver"
modes = ["headless", "headed"]

[[tool]]
name = "zendriver"
modes = ["headless", "headed"]

[[tool]]
name = "scrapling"
modes = ["headless", "headed"]

[[tool]]
name = "seleniumbase"
modes = ["headless", "headed"]

# Targets. A try passes when the page HTML matches "expect" (a regular expression).
# kind: "open" has no protection, "test" is a bot test page, "site" is a protected site.
# Only "test" and "site" count for the score.
# The vendor of each site was confirmed from its own response, see the note on each one.

[[target]]
id = "example"
name = "example.com"
kind = "open"
vendor = "none"
url = "https://example.com/"
expect = "Example Domain"

[[target]]
id = "browserscan"
name = "BrowserScan"
kind = "test"
vendor = "bot test"
url = "https://www.browserscan.net/bot-detection"
expect = 'Test Results:</strong>(<[^>]*>|\s)*Normal'

[[target]]
id = "deviceandbrowserinfo"
name = "DeviceAndBrowserInfo"
kind = "test"
vendor = "bot test"
url = "https://deviceandbrowserinfo.com/are_you_a_bot"
expect = "You are human"

# A practice page made for testing scrapers. It sits behind a Cloudflare challenge.
[[target]]
id = "cloudflare-practice"
name = "ScrapingCourse challenge"
kind = "site"
vendor = "Cloudflare"
url = "https://www.scrapingcourse.com/cloudflare-challenge"
expect = "You bypassed the Cloudflare challenge"

# A demo page behind a Cloudflare Turnstile challenge.
[[target]]
id = "cloudflare-turnstile"
name = "NopeCHA demo"
kind = "site"
vendor = "Cloudflare"
url = "https://nopecha.com/demo/cloudflare"
expect = 'id="padded_content"'

