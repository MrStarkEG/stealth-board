# Runs every tool once a day, saves the results in the repo, and publishes the dashboard.
# The steps call the same commands you can run on your own machine (see docs/run-locally.md).
name: Daily run

on:
  schedule:
    - cron: "17 5 * * *" # every day at 05:17 UTC
  workflow_dispatch: # also allow a manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  list-tools:
    # Reads the tool names from scoreboard.toml, so a new tool needs no change here.
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.tools.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
      - id: tools
        run: |
          echo "tools=$(python3 -c "import json, tomllib; print(json.dumps([t['name'] for t in tomllib.load(open('scoreboard.toml', 'rb'))['tool']]))")" >> "$GITHUB_OUTPUT"

  test:
    # One job per tool. A tool that breaks cannot affect the others.
    needs: list-tools
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.list-tools.outputs.tools) }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Install a virtual screen and Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          if ! command -v google-chrome; then
            curl -fsSLo /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version
      - name: Run the tool against every target
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m scoreboard.run --tool "${{ matrix.tool }}" --runner github --ip-type datacenter
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.tool }}
          path: results/
          if-no-files-found: error

  publish:
    # Runs even when a test job failed, so one bad tool never stops the update.
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results/
          merge-multiple: true
      - name: Save the results in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Add results for $(date -u +%F)"
          git push
      - name: Build the dashboard data
        run: python3 -m scoreboard.build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@v5
