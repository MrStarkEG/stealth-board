# Started by hand from the Actions tab. No browser and no outside network are needed.
name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Check the config
        run: python3 -m stealth_board.check
      - name: Run the tests
        run: python3 -m unittest discover tests -v
